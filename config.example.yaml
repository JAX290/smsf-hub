# ==============================================================================
#  SmsForwarder Hub —— 配置总表
# ------------------------------------------------------------------------------
#  【这就是你的操作界面】
#  所有可调参数都在这个文件里。你不用懂代码 ——
#  想改什么，直接跟我说「把合并窗口改成 120 秒」这种话，我改这里并重启服务。
#  每一行后面的注释就是这个参数在说什么。看不懂的不要紧，大部分不用动。
#
#  改完必须重启服务才生效：  sudo systemctl restart smsf-hub
# ==============================================================================

server:
  # 手机上报入口。
  # ⚠️ 只绑 127.0.0.1 —— 外部必须经过 nginx 反代，公网无法直接访问这个端口。
  # 手机实际填的地址形如： https://你的域名/smsf/hook
  listen_host: "127.0.0.1"
  listen_port: 8701
  # nginx 反代时的路径前缀（要和 /etc/nginx 里配的一致）
  url_prefix: "/smsf"

  # 控制面板。⚠️ 只绑 Tailscale IP —— 只有你自己的 Tailscale 网络能打开。
  # 填你自己的 Tailscale IP（服务器上执行 tailscale ip -4 可以查到）。
  panel_host: "100.x.y.z"
  panel_port: 8702

  # 生成「下载归档」链接时用的外部地址（填你的域名或 Tailscale 地址）
  public_base_url: "https://你的域名/smsf"
  # ⚠️ 手机端要填的上报地址前缀（会显示在面板的「自测/手机配置」页里）
  # 建议用 DNS 直连源站的域名，不要走 Cloudflare（否则源 IP 会暴露、也可能被拦）
  phone_base_url: "https://你的域名/smsf/hook"
  # 面板地址（只给你的 Tailscale 用）
  panel_url: "http://100.x.y.z:8702"

# ------------------------------------------------------------------------------
# 安全：手机与服务端之间的鉴权
# ------------------------------------------------------------------------------
security:
  # 和手机上 SmsForwarder 里填的 secret 必须完全一致。改这里也要改手机。
  # 要求：至少 32 位随机字符。生成方法（服务器上执行）：
  #   openssl rand -hex 32
  secret: "请改成你自己的长随机串_至少32位"

  # 时间戳允许的误差范围（秒）。超过范围的上报直接拒绝，防止别人重放旧报文。
  timestamp_tolerance_seconds: 300

  # 可选：再加一道自定义请求头校验（手机 headers 里填同样的）
  extra_token_header: ""
  extra_token_value: ""

  # ----------------------------------------------------------------------------
  #  配对钥匙（换服务器后自动重新绑定 secret）
  # ----------------------------------------------------------------------------
  #  换 VPS 时，如果 config.yaml 没带过去，新服务器会生成一个不同的 secret，
  #  手机怎么发都会被拒。配一把「配对钥匙」就能自动恢复：
  #
  #    手机发现被拒 → 用这把钥匙问服务器「现在的 secret 是什么」
  #    → 服务器答 → 手机自动更新 → 恢复正常（你什么都不用做）
  #
  #  这把钥匙和手机 APK 里内置的必须一致。生成方法：
  #      openssl rand -hex 32
  #
  #  ⚠️ 它会编译进 APK，请当成「半公开」信息看待。安全性靠的是：
  #     配对闸门【默认关闭】，只在换服务器时临时开启，配对成功立即自动关。
  #     所以平时就算这把钥匙泄露了也用不上。
  pair_key: ""

  #  配对闸门状态文件（记录当前是开还是关、还剩多久）
  pair_gate_file: "./app/data/pair_gate.json"

  #  配对记录（谁、什么时候、从哪个 IP 配的）。配对了会写一行，用来事后核对。
  pair_log_file: "./app/data/pair_log.jsonl"

  #  配对接口每分钟最多接受几次请求（防止被反复试探）
  pair_rate_limit_per_minute: 6

# ------------------------------------------------------------------------------
# 去重：同样的内容短时间内重复上报，只处理一次
# ------------------------------------------------------------------------------
dedup:
  enable: true
  # ⚠️ 这个窗口不要调太小。
  #    手机端有「离线待发队列」：网络不通或换服务器后没配对成功时，
  #    失败的消息会存下来，等网络恢复自动重发。重试间隔是退避的，
  #    最长到 10 分钟。窗口如果只有 60 秒，这些重发就会落到窗口外，
  #    于是「服务端其实早就收到、只是当时响应超时」的消息会被重复记录一遍。
  #    900 秒可以覆盖整个退避过程。
  #    指纹里不含时间戳，所以放大窗口不会误伤真正不同的消息。
  window_seconds: 900
  max_entries: 20000        # 内存中最多记住多少条指纹

# ------------------------------------------------------------------------------
# 合并发送：短时间内多条消息合并成一条再推送（避免刷屏，也绕开渠道限流）
# ------------------------------------------------------------------------------
merge:
  enable: true
  window_seconds: 60        # 合并窗口。60 秒内的消息攒一起发。想更实时就改小，比如 15
  max_items: 20             # 一条合并消息最多含几条。超过就立刻发出，剩下的重新攒
  group_by: "subject"       # 按什么分组：subject(来源主题) / app(App名) / none(全部混在一起)
  separator: "\n---\n"     # 合并时消息之间的分隔线

# ------------------------------------------------------------------------------
# 归档：把收到的消息存成 Markdown 文件
# ------------------------------------------------------------------------------
archive:
  enable: true
  root: "/opt/smsf-hub/app/data/archive"
  # 目录结构： 设备 / 类型 / 主题 / 日期.md
  #   例：    SF-B7AEFBF931/短信/1069xxxx/2026-09-22.md
  #           SF-B7AEFBF931/APP通知/微信/2026-09-22.md
  #           SF-B7AEFBF931/来电/13800138000/2026-09-22.md
  #           SF-B7AEFBF931/定位/2026-09-22.md      ← subject_rules 为 none，少一层
  #
  # 第一层是「设备」，用的是手机上报时带的稳定设备 ID（形如 SF-XXXXXXXX），
  # 不是可改的备注名 —— 否则你把「红米」改成「小米」会把同一台机器拆成两组。
  # 设备备注在面板「终端」页里改。
  #
  # 「主题」取什么值，见下面 subject_rules
  subject_rules:
    sms: "sender"           # 短信：按发件人号码分主题
    call: "sender"          # 来电：按来电号码分主题
    notify: "app"           # APP通知：按应用名分主题
    sent: "sender"          # 已发送短信：按收件人号码分主题
    location: "none"        # 定位：不分主题，直接以日期归档
                            # 可选值：sender(发件人/号码) / app(应用名) / none(不分主题)

  # 单文件大小上限（MB）。超过就滚动成 2026-09-22.part2.md，避免一个文件无限变大
  file_max_mb: 5

  # 归档总量上限（MB）。超过就在面板首页报警并提示打包下载
  total_max_mb: 512

  # 触发提醒的阈值（占 total_max_mb 的百分比）。到 80% 就变黄，到 100% 变红
  warn_percent: 80

  # 单条消息内容太长时截断（字符）。0 = 不截断
  content_max_chars: 4000

  # 磁盘剩余空间低于这个值（GB）时，面板报警提示你下载归档。
  # 【重要】归档永远不会被自动删除：原始数据一直留着，只在快满时提醒。
  warn_free_gb: 2.0

# ------------------------------------------------------------------------------
# 消息分级（降噪核心）
#
# 目的：把「真正通知用户的消息」和「系统/应用在自报状态」分开。
# 判定顺序（先命中先返回）：
#   1. 手机端上报的通知属性（最可靠）——正文末尾那行 NAT|cat=..|ong=..|imp=..|grp=..
#      · ong=1（常驻，如"正在播放""VPN 已连接"）→ 噪音
#      · cat=（Android 通知类别：msg/call/email/service/progress/transport…）→ 查表
#   2. 消息类型：短信/来电 → 关键；已发送 → 重要；定位 → 次要
#   3. 关键关键词（验证码/转账/快递…）→ 关键。**排在应用清单前面**，
#      因为验证码短信常由系统短信组件（com.android.mms）发通知，先按包名判会误伤
#   4. 噪音应用 / 噪音关键词 → 噪音
#   5. 重要应用 → 重要
#   6. 兜底 → 普通
#
# 下面四个清单都支持两种写法：YAML 列表，或逗号分隔的字符串（面板表单用后者）。
# 留空 = 用 app/classify.py 里的内置默认清单。
# 面板「参数设置 → 消息分级」改完立即生效，不用重启。
# ------------------------------------------------------------------------------
priority:
  enable: true
  # 低于这个层级只归档、不推送。3 = 重要及以上才推（推荐）
  min_push_tier: 3
  # 重要应用（真人消息为主）：留空用内置默认（微信/QQ/钉钉/飞书/Telegram/WhatsApp…）
  important_apps: ""
  # 噪音应用（系统/工具自报状态）：留空用内置默认
  #（系统短信组件、SIM 激活服务、睡眠服务、智能卡、查找设备、应用市场、VPN、音乐播放器…）
  noise_apps: ""
  # 关键关键词：命中即判「关键」
  important_keywords: ""
  # 噪音关键词：命中即判「噪音」
  noise_keywords: ""

# ------------------------------------------------------------------------------
# 分析监控（面板「分析监控」页）
# 每日摘要 / 关键词监控 / 异常检测，全部只读，不改任何数据。
# ------------------------------------------------------------------------------
analysis:
  enable: true
  # 关注词：命中的消息会单独列在「关键词监控」里。留空用内置默认
  watch_keywords: ""
  # 通知量暴涨：某应用某一小时 ≥ 它平均每小时的这个倍数，且条数 ≥ spike_min_count
  spike_factor: 3.0
  spike_min_count: 30
  # 一小时内验证码达到这个数就报警（可能是有人在拿你的号试探注册/登录）
  code_burst: 6

# ------------------------------------------------------------------------------
# 推送渠道：手机只发到一个地址，这里想开几个开几个
# 填了 token/url 的才会启用；留空表示不启用
# ------------------------------------------------------------------------------
channels:
  # 企业微信群机器人（注意：官方限 20 条/分钟，靠上面的 merge 合并来规避）
  wework_robot:
    enable: false
    webhook: ""
    msgtype: "markdown"     # text 或 markdown
    at_all: false
    at_mobiles: ""

  # 企业微信应用消息（需要企业管理员建自建应用）
  wework_agent:
    enable: false
    corp_id: ""
    agent_id: ""
    secret: ""
    to_user: "@all"

  # 钉钉群机器人
  dingtalk_robot:
    enable: false
    webhook: ""
    secret: ""              # 钉钉的加签密钥
    at_all: false
    at_mobiles: ""

  # 飞书群机器人
  feishu_robot:
    enable: false
    webhook: ""
    secret: ""

  # Telegram 机器人（服务器需要能访问 api.telegram.org）
  telegram:
    enable: false
    bot_token: ""
    chat_id: ""
    api_base: "https://api.telegram.org"

  # Bark（推送到你的 iPhone）
  bark:
    enable: false
    server: "https://api.day.app"
    device_key: ""
    group: "短信转发"
    sound: ""

  # ntfy（可自建）
  ntfy:
    enable: false
    server: "https://ntfy.sh"
    topic: ""
    token: ""

  # Gotify（自建）
  gotify:
    enable: false
    server: ""
    token: ""
    priority: 5

  # PushPlus
  pushplus:
    enable: false
    token: ""
    topic: ""

  # Server酱
  serverchan:
    enable: false
    send_key: ""

  # 邮件
  smtp:
    enable: false
    host: ""
    port: 465
    ssl: true
    username: ""
    password: ""
    mail_from: ""
    mail_to: ""
    subject_prefix: "[短信转发]"

  # 通用 Webhook（自己接别的系统用）
  webhook:
    enable: false
    url: ""
    method: "POST"
    headers: {}
    body_template: '{"title":"[title]","content":"[content]","from":"[from]","device":"[device]","time":"[time]"}'

# ------------------------------------------------------------------------------
# 面板与日志
# ------------------------------------------------------------------------------
panel:
  title: "短信转发中枢"
  # 面板登录口令（Tailscale 之外再加一道）
  password: "请改成你自己的口令"

  # APK 下载目录（服务器上的绝对路径）。
  # 由 deploy/install.sh 自动生成一个带随机串的名字（避免被人猜到路径直接抓包），
  # deploy/publish_apk.py 会读这一项来决定往哪传。
  apk_download_dir: ""
  # 每页显示多少条记录
  page_size: 50
  # 面板「消息流」内存里保留多少条（越大能翻得越早，占内存）。
  # 500 条在忙的手机上只覆盖约 3 小时，所以默认调到 8000（约 2 天）。
  # 更早的历史请用「归档搜索」页，那里没有窗口限制。
  recent_keep: 8000

  # 最近消息落盘文件保留多少条（比内存大得多，重启后还能翻回去）。
  # 估算：单条约 300 字节，200000 条 ≈ 60MB。
  recent_file_keep: 200000

  # 安装包（APK）下载总开关。
  # false = 外部访问 你的域名/apk1、apk2、apk3 一律返回「下载未开启」；
  # true  = 允许下载。
  # 在面板「参数设置 → 面板」里也能改，改完立即生效，不用重启服务。
  apk_download_enabled: false

  # 最近消息落盘文件（重启服务后列表不会丢）。
  # 相对路径相对于 config.yaml 所在目录。
  recent_file: "./app/data/recent.jsonl"

log:
  level: "INFO"             # DEBUG / INFO / WARNING / ERROR
  file: "/opt/smsf-hub/app/data/logs/hub.log"
  max_mb: 20                # 日志轮转大小
  backup_count: 5
