# ==============================================================================
#  SmsForwarder Hub —— nginx 反代片段
#  用法：把这段 location 加进 /etc/nginx/sites-available/stratum-public-status
#        放在现有的 location / { ... } 之前（更具体的路径优先匹配）
# ==============================================================================

    # 手机上报入口。只允许 POST，且限制速率，防止被扫。
    location /smsf/hook {
        # 只接受 POST
        limit_except POST { deny all; }

        # 限速：每秒最多 5 次，突发 20（短信轰炸时也够）
        limit_req zone=smsf_hook burst=20 nodelay;

        # 请求体最大 1MB（一条短信/通知远小于此）
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # 面板的归档下载走这里（面板本身只开在 Tailscale IP 上，这段给 Tailscale 内访问用）
    location /smsf/panel/ {
        proxy_pass http://100.118.119.84:8702/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

# 另外，在 nginx.conf 的 http {} 段里加一行限速区定义：
#     limit_req_zone $binary_remote_addr zone=smsf_hook:10m rate=5r/s;
