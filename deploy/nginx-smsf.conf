# ==============================================================================
#  SmsForwarder Hub —— nginx 反代片段
#  用法（推荐）：跑 deploy/install.sh，它会自动探测 Tailscale IP 并生成填好的版本
#                输出到 deploy/nginx-smsf.filled.conf
#  用法（手工）：把这段 location 加进你自己的站点配置，
#               放在现有的 location / { ... } 之前（更具体的路径优先匹配），
#               并把 __PANEL_HOST__ / __PANEL_PORT__ 替换成实际值
# ==============================================================================

    # 手机上报入口。只允许 POST，且限制速率，防止被扫。
    location /smsf/hook {
        # 只接受 POST
        limit_except POST { deny all; }

        # 限速：每秒最多 5 次，突发 20（短信轰炸时也够）
        limit_req zone=smsf_hook burst=20 nodelay;

        # 请求体最大 1MB（一条短信/通知远小于此）
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # 面板的归档下载走这里（面板本身只开在 Tailscale IP 上，这段给 Tailscale 内访问用）
    #
    # ⚠️ __PANEL_HOST__ / __PANEL_PORT__ 是占位符，由 deploy/install.sh 自动替换：
    #      __PANEL_HOST__  <- config.yaml 的 server.panel_host （自动探测的 Tailscale IP）
    #      __PANEL_PORT__  <- config.yaml 的 server.panel_port
    #    如果你想手工用这份片段，把这两处替换成自己的值即可。
    location /smsf/panel/ {
        proxy_pass http://__PANEL_HOST__:__PANEL_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

# 另外，在 nginx.conf 的 http {} 段里加一行限速区定义：
#     limit_req_zone $binary_remote_addr zone=smsf_hook:10m rate=5r/s;
