# ==============================================================================
#  SmsForwarder Hub —— nginx 反代片段
#
#  用法（推荐）：跑 deploy/install.sh
#                它会自动探测 Tailscale IP、生成随机下载路径、把占位符全部替换好，
#                输出到 deploy/nginx-smsf.filled.conf
#
#  用法（手工）：把下面这些 location 加进你自己的站点配置，
#                放在现有的 location / { ... } 之前（更具体的路径优先匹配），
#                并把下面四个占位符替换成实际值：
#                  __PANEL_HOST__  面板绑定的 IP（通常是 Tailscale IP）
#                  __PANEL_PORT__  面板端口
#                  __DL_SLUG__     下载路径的随机串（自己随便起一串十六进制）
#                  __GATE_ROOT__   拒绝页所在目录
# ==============================================================================

    # 手机上报入口。只允许 POST，且限制速率，防止被扫。
    location /smsf/hook {
        limit_except POST { deny all; }
        limit_req zone=smsf_hook burst=20 nodelay;
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # 配对接口（换服务器时手机自动来取 secret）。只允许 POST。
    location = /smsf/pair {
        limit_except POST { deny all; }
        limit_req zone=smsf_hook burst=10 nodelay;
        client_max_body_size 4k;

        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # 面板的归档下载（面板本身只开在 Tailscale IP 上）
    location /smsf/panel/ {
        proxy_pass http://__PANEL_HOST__:__PANEL_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ==========================================================================
    #  安装包（APK）下载
    #
    #  ⚠️ 文件不随代码仓库分发 —— 它们是二进制产物。
    #     新部署或换 VPS 之后，必须在本机跑一次：
    #         python deploy/publish_apk.py
    #     把三个包传到 __DL_SLUG__ 那个目录里，下面这些 location 才有内容可下。
    #     目录由 install.sh 自动创建（空目录），publish_apk.py 负责填充。
    #
    #  整套下载都受面板「允许下载安装包」开关控制：
    #      nginx 通过 auth_request 内部问 /gate/apk，
    #      200 = 放行，403 = 显示 __GATE_ROOT__/__apk_denied.html
    # ==========================================================================

    # 目录形式（列出目录，默认关闭 autoindex，只用来直接贴文件链接）
    location /dl/__DL_SLUG__/ {
        auth_request /__apk_gate;
        error_page 403 /__apk_denied.html;
        alias /var/www/smsf-dl-__DL_SLUG__/;
        autoindex off;
        limit_except GET { deny all; }
        add_header Content-Disposition "attachment";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    # 短地址直连下载（点了直接下文件，不经过网页）
    location = /apk-__DL_SLUG__ {
        auth_request /__apk_gate;
        error_page 403 /__apk_denied.html;
        alias /var/www/smsf-dl-__DL_SLUG__/smsf-arm64.apk;
        default_type application/vnd.android.package-archive;
        limit_except GET { deny all; }
        add_header Content-Disposition "attachment; filename=SmsForwarder-arm64.apk";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    # ===== 主下载地址（人记的是这三个）=====
    # /apk1 = arm64  绝大多数手机用这个
    # /apk2 = 通用
    # /apk3 = 32 位（armeabi-v7a）
    location = /apk1 {
        auth_request /__apk_gate;
        error_page 403 /__apk_denied.html;
        alias /var/www/smsf-dl-__DL_SLUG__/smsf-arm64.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=SmsForwarder-arm64.apk";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /apk2 {
        auth_request /__apk_gate;
        error_page 403 /__apk_denied.html;
        alias /var/www/smsf-dl-__DL_SLUG__/smsf-universal.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=SmsForwarder-universal.apk";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location = /apk3 {
        auth_request /__apk_gate;
        error_page 403 /__apk_denied.html;
        alias /var/www/smsf-dl-__DL_SLUG__/smsf-v7a.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=SmsForwarder-v7a.apk";
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    # 闸门：向面板求证「现在允许下载吗」
    location = /__apk_gate {
        internal;
        proxy_pass http://__PANEL_HOST__:__PANEL_PORT__/gate/apk;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # 被拒绝时显示的页面
    location = /__apk_denied.html {
        internal;
        root __GATE_ROOT__;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

# ------------------------------------------------------------------------------
# 另外，在 nginx.conf 的 http {} 段里加一行限速区定义（没有的话 limit_req 会报错）：
#     limit_req_zone $binary_remote_addr zone=smsf_hook:10m rate=5r/s;
# ------------------------------------------------------------------------------
